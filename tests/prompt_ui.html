<!doctype html><html lang="zh"><meta charset="utf-8"><title>RuYi Prompt UI tests</title>
<style>body{background:#252525;color:#eee;font:14px system-ui}.host{width:780px;margin:20px;border:1px solid #555}.h-full{height:100%}pre#results{white-space:pre-wrap}</style>
<h2>RuYi Prompt UI</h2><pre id="results"></pre><div id="nodes"></div>
<script type="module">
import {app} from '/scripts/app.js';
import '/extensions/RuYi-Nodes/ruyi_prompt.js';
import '/extensions/RuYi-Nodes/ruyi_prompt_canvas.js';
const result=document.querySelector('#results'), frames=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
function check(value,message){if(!value)throw Error(message)}
function create(frameworkHeight=false,legacyEditor=false){const host=document.createElement('div');host.className='host';document.querySelector('#nodes').append(host);
 if(frameworkHeight)host.style.height='500px';
 const node={comfyClass:'RuYiPrompt',size:[800,500],widgets:[],properties:{},computeSize(){return [800,70+(this.widgets[0]?.computeSize?.(800)[1]||330)]},setSize(size){this.size=size;if(frameworkHeight)host.style.height=`${size[1]}px`;this.onResize?.(size)},setDirtyCanvas(){},
 addDOMWidget(name,type,panel,options){if(legacyEditor)delete options.canvasOnly;if(frameworkHeight)panel.classList.add('h-full','w-full');host.append(panel);const widget={...options,options,name,type,y:82,margin:10};Object.defineProperty(widget,'value',{get:options.getValue,set:options.setValue});this.widgets.push(widget);return widget}};
 const {widget}=app.extensions.find(x=>x.name==='RuYi-Nodes.Prompt').getCustomWidgets().RUYI_PROMPT(node,'prompt_data');for(const extension of app.extensions)extension.nodeCreated?.(node);return {host,node,widget};}
async function test(name,fn){try{await fn();result.textContent+=`PASS ${name}\n`}catch(e){result.textContent+=`FAIL ${name}: ${e.message}\n`}}
const until=async (check,timeout=60000)=>{const end=Date.now()+timeout;while(!check()){if(Date.now()>end)throw Error('Timed out waiting for real Worker');await new Promise(r=>setTimeout(r,30));}};
await test('Parameter inspector leaves canvas editor geometry and text intact',async()=>{
 const {host,node,widget}=create();await frames();host.querySelector('textarea').value='blue eyes, soft light';host.querySelector('textarea').dispatchEvent(new Event('input'));
 const original=widget.value, width=host.querySelector('textarea').clientWidth, y=widget.y;
 // ComfyUI 1.53 WidgetLegacy renders unknown panel widgets on a small canvas,
 // writing its width and y back to the SAME widget used by the graph overlay.
 for(const inspectorWidth of [120,240,320]){
  for(const item of node.widgets.filter(w=>!w.options.canvasOnly&&!w.options.hidden&&!w.options.hideInPanel)){
   item.y=0;item.width=inspectorWidth;
  }
  host.style.width=`${(widget.width??node.size[0])-widget.margin*2}px`;await frames();
  check(host.querySelector('textarea').clientWidth===width&&widget.y===y,'inspector shrinks or displaces graph editor');
  check(widget.value===original,'inspector changes prompt text');
 }
});
await test('Legacy inspector cannot narrow editor; workflow restore and node resizing retain full width',async()=>{
 const {host,node,widget}=create(false,true);widget.value=JSON.stringify({version:1,positive:[{text:'blue eyes, soft light'}],negative:[{text:'blur'}]});await frames();const original=widget.value;
 check(!node.widgets.some(w=>!w.options.canvasOnly&&!w.options.hidden&&!w.options.hideInPanel),'cached editor still appears in legacy inspector');
 // The desktop may still load its cached editor without canvasOnly. Even a
 // legacy inspector writing directly to the widget must not own canvas width.
 for(const nodeWidth of [800,960,700]){
  node.setSize([nodeWidth,node.size[1]]);widget.width=120;
  host.style.width=`${(widget.width??node.size[0])-widget.margin*2}px`;await frames();
  check(host.clientWidth===nodeWidth-20,'legacy inspector overwrites canvas width');
  check(host.querySelector('textarea').clientWidth>nodeWidth-110,'editor collapses inside its wrapper');
  check(widget.value===original,'layout protection changes saved prompts');
 }
});

await test('Add, reorder, disable, collapse and restore sections without cross-node state',async()=>{const {host,widget}=create();await frames();host.querySelector('[data-add="positive"]').click();const edits=host.querySelectorAll('[data-side="positive"] textarea[data-section]');edits[1].value='role 2';edits[1].dispatchEvent(new Event('input'));const cards=host.querySelectorAll('[data-side="positive"] .ruyi-prompt-section');cards[1].querySelector('[data-action="up"]').click();let saved=JSON.parse(widget.value);check(saved.positive[0].text==='role 2','reorder wrong');host.querySelector('[data-side="positive"] [data-action="enable"]').click();host.querySelector('[data-side="positive"] [data-action="collapse"]').click();const other=create();other.widget.value=widget.value;await frames();check(JSON.parse(other.widget.value).positive[0].enabled===false,'enable lost');check(JSON.parse(other.widget.value).positive[0].collapsed===true,'collapse lost');other.host.querySelector('[data-add="positive"]').click();check(JSON.parse(widget.value).positive.length===2,'copied state shared');});

await test('Search and typo navigation reveal words inside a scrolled paragraph',async()=>{const {host}=create();await frames();const input=host.querySelector('textarea[data-section]');input.value=Array.from({length:60},()=> 'ordinary line').join('\n')+'\nbackgroun';input.dispatchEvent(new Event('input'));const search=host.querySelector('.ruyi-prompt-search');search.value='backgroun';search.dispatchEvent(new Event('input'));host.querySelector('[data-action=next-match]').click();check(input.scrollTop>300,'search selects but does not scroll text');check(input.value.slice(input.selectionStart,input.selectionEnd)==='backgroun','wrong search selection');search.value='';search.dispatchEvent(new Event('input'));input.scrollTop=0;await until(()=>host.querySelector('.ruyi-prompt-error-list button'));host.querySelector('.ruyi-prompt-error-list button').click();const locate=document.querySelector('.ruyi-prompt-popup button');check(locate.textContent.includes('定位'),'locate action missing at top');locate.click();check(input.scrollTop>300&&input.value.slice(input.selectionStart,input.selectionEnd)==='backgroun','typo not revealed');});
await test('Negative visibility persists without erasing its text',async()=>{const {host,widget}=create();await frames();const neg=host.querySelector('[data-side=negative] textarea');neg.value='bad hands';neg.dispatchEvent(new Event('input'));host.querySelector('.ruyi-prompt-toolbar button:last-child').click();const toggle=[...host.querySelectorAll('.ruyi-prompt-settings label')].find(x=>x.textContent==='启用负面提示词')?.querySelector('input');check(toggle,'negative switch missing');toggle.click();check(host.querySelector('[data-side=negative]').hidden,'negative editor visible');check(JSON.parse(widget.value).negative[0].text==='bad hands','negative lost');const other=create();other.widget.value=widget.value;await frames();check(other.host.querySelector('[data-side=negative]').hidden,'negative switch not restored');toggle.click();check(!host.querySelector('[data-side=negative]').hidden&&neg.value==='bad hands','negative re-enable loses original editor');});
await test('Paragraph height persists; scrollbar has normal cursor and scrolls overlay',async()=>{const {host,widget}=create();await frames();const grip=host.querySelector('[role=separator]');check(grip,'paragraph resize handle missing');const old=host.querySelector('.ruyi-prompt-edit-wrap').offsetHeight;grip.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));check(host.querySelector('.ruyi-prompt-edit-wrap').offsetHeight>old,'height adjustment ineffective');const other=create();other.widget.value=widget.value;await frames();check(other.host.querySelector('.ruyi-prompt-edit-wrap').offsetHeight===host.querySelector('.ruyi-prompt-edit-wrap').offsetHeight,'height not restored');const input=host.querySelector('textarea');input.value='line\n'.repeat(70);input.dispatchEvent(new Event('input'));await frames();const bar=host.querySelector('[role=scrollbar]');check(bar&&bar.offsetWidth>=14&&getComputedStyle(bar).cursor!=='text','scrollbar is thin or has text cursor');bar.dispatchEvent(new KeyboardEvent('keydown',{key:'End',bubbles:true}));await frames();check(input.scrollTop>300&&host.querySelector('.ruyi-prompt-overlay').scrollTop===input.scrollTop,'scrollbar does not sync overlay');});

await test('Previous search starts at last match; collapsed wrapped text is revealed at zoom',async()=>{const {host,widget}=create();host.style.transform='scale(.5)';host.style.transformOrigin='top left';widget.value=JSON.stringify({version:1,positive:[{text:'blue eyes\n'+('long descriptive line with soft light and landscape '.repeat(160))+'targetword',collapsed:true}],negative:[{text:'targetword'}]});await frames();const search=host.querySelector('.ruyi-prompt-search');search.value='targetword';search.dispatchEvent(new Event('input'));host.querySelector('[data-action=previous-match]').click();const neg=host.querySelector('[data-side=negative] textarea');check(neg.selectionEnd===10&&document.activeElement===neg,'previous does not start at last result');host.querySelector('[data-action=previous-match]').click();const input=host.querySelector('[data-side=positive] textarea');check(!input.parentElement.hidden&&input.value.slice(input.selectionStart,input.selectionEnd)==='targetword','collapsed result not selected');const span=[...host.querySelector('[data-side=positive] .ruyi-prompt-overlay').children].find(x=>x.textContent==='targetword');const box=input.getBoundingClientRect(),range=span.getBoundingClientRect();check(input.scrollTop>500&&range.top>=box.top-1&&range.bottom<=box.bottom+1,'wrapped result not visible at zoom');});

 const popup=document.querySelector('.ruyi-prompt-popup'),overlay=host.querySelector('.ruyi-prompt-overlay'),range=document.createRange();range.selectNodeContents(overlay);range.setStart(overlay.firstChild.firstChild,overlay.firstChild.textContent.length-2);const source=range.getClientRects()[0],position=popup.getBoundingClientRect();check(position.top>source.bottom&&position.top-source.bottom<35*zoom,'popup does not follow the rendered source line at zoom');check(Math.abs(position.left-source.right)<4,'popup does not follow the caret horizontally');

await test('Canceled IME does not query; committed IME survives the final duplicate input event',async()=>{const {host,widget}=create();widget.value=JSON.stringify({version:1,positive:[{text:'blue ey'}],negative:[]});await frames();const input=host.querySelector('textarea');input.focus();input.setSelectionRange(7,7);input.dispatchEvent(new CompositionEvent('compositionstart'));input.dispatchEvent(new CompositionEvent('compositionend'));await new Promise(r=>setTimeout(r,350));check(!document.querySelector('.ruyi-prompt-popup'),'canceled composition triggers completion');input.dispatchEvent(new CompositionEvent('compositionstart'));input.value='长发';input.setSelectionRange(2,2);input.dispatchEvent(new InputEvent('input',{isComposing:true}));await new Promise(r=>setTimeout(r,350));check(!document.querySelector('.ruyi-prompt-popup'),'composition opens completion before commit');input.dispatchEvent(new CompositionEvent('compositionend'));input.dispatchEvent(new InputEvent('input',{inputType:'insertFromComposition'}));await until(()=>document.querySelector('.ruyi-prompt-popup [role=option]'),2500);check(document.querySelector('.ruyi-prompt-popup [role=option]').textContent.startsWith('long hair'),'IME commit does not query Chinese translation');input.blur();});
await test('Prose completion replaces the matched suffix and preserves sentence text',async()=>{const {host}=create();await frames();const input=host.querySelector('textarea');input.focus();input.value='She has blue ey and a smile';input.setSelectionRange(15,15);input.dispatchEvent(new Event('input'));await until(()=>document.querySelector('.ruyi-prompt-popup [role=option]'),2500);input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));check(input.value==='She has blue eyes and a smile','prose completion removes sentence prefix or suffix');input.blur();});
await test('Completion preserves prose and punctuation after a tag at the beginning of a sentence',async()=>{const {host}=create();await frames();const input=host.querySelector('textarea');for(const original of ['blue ey with a smile','blue ey. A girl stands in a forest.','A girl has blue ey. She smiles.']){input.focus();input.value=original;const caret=original.indexOf('ey')+2;input.setSelectionRange(caret,caret);input.dispatchEvent(new Event('input'));await until(()=>document.querySelector('.ruyi-prompt-popup [role=option]'),2500);input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));check(input.value===original.replace('blue ey','blue eyes'),'sentence suffix or punctuation lost');}input.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));input.dispatchEvent(new Event('scroll'));await new Promise(r=>setTimeout(r,500));check(!document.querySelector('.ruyi-prompt-popup'),'closing suggestions followed by scrolling reopens them');input.blur();});
await test('Re-completing an existing tag inside prose does not duplicate its remaining words',async()=>{const {host}=create();await frames();const input=host.querySelector('textarea');for(const text of ['blue eyes  and a smile','She has blue eyes and a smile']){input.focus();input.value=text;input.setSelectionRange(text.indexOf('blue')+4,text.indexOf('blue')+4);input.dispatchEvent(new Event('input'));await until(()=>document.querySelector('.ruyi-prompt-popup [role=option]'),2500);const candidate=[...document.querySelectorAll('.ruyi-prompt-popup [role=option]')].find(b=>b.firstChild.textContent==='blue eyes');check(candidate,'blue eyes candidate missing');candidate.click();check(input.value===text,'existing tag words duplicated or suffix spacing lost');}input.blur();});
await test('Section movement and delete controls match LoRA height, padding and colors',async()=>{const {host}=create();await frames();host.querySelector('[data-add=positive]').click();const head=host.querySelector('.ruyi-prompt-section-head');for(const action of ['up','down','delete']){const style=getComputedStyle(head.querySelector(`[data-action=${action}]`));check(style.height==='28px'&&style.paddingTop==='3px'&&style.paddingLeft==='8px'&&style.borderRadius==='5px','button metrics differ from LoRA');}const remove=head.querySelector('[data-action=delete]');check(remove.textContent==='❌ 删除'&&getComputedStyle(remove).color==='rgb(242, 176, 176)','delete label/color missing');remove.click();check(host.querySelectorAll('[data-side=positive] .ruyi-prompt-section').length===1,'delete no longer works');});
await test('rm completion requires the complete continuous fragment; exact alias explains its match',async()=>{const {host}=create();await frames();const input=host.querySelector('textarea');input.focus();input.value='She wears glasses and a wristwatch. rm';input.setSelectionRange(input.value.length,input.value.length);input.dispatchEvent(new Event('input'));await until(()=>document.querySelector('.ruyi-prompt-popup [role=option]'),3500);const options=[...document.querySelectorAll('.ruyi-prompt-popup [role=option]')];check(options.every(b=>b.textContent.toLowerCase().includes('rm')),'non-contiguous fragment or partial alias included');check(!options.some(b=>/nadeko|hizack|rick dias|marasai|barzam/.test(b.firstChild.textContent)),'RMA/RMS partial aliases still included');

await test('Add paragraph displays a green plus without changing the button height',async()=>{const {host}=create();await frames();const add=host.querySelector('[data-add=positive]'),icon=add.querySelector('.ruyi-prompt-add-icon');check(icon?.textContent==='✚'&&getComputedStyle(icon).color==='rgb(131, 206, 141)','green add icon missing');check(icon.getAttribute('aria-hidden')==='true','decorative icon read as button name');add.click();check(host.querySelectorAll('[data-side=positive] .ruyi-prompt-section').length===2,'add button no longer works');});
await test('Queue shortcuts reach ComfyUI without accepting completion or editing text',async()=>{const {host}=create();await frames();const input=host.querySelector('textarea');let received=0;const run=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))received++};document.addEventListener('keydown',run);try{input.focus();input.value='blue ey';input.setSelectionRange(7,7);input.dispatchEvent(new Event('input'));await until(()=>document.querySelector('.ruyi-prompt-popup [role=option]'),2500);for(const modifier of [{ctrlKey:true},{ctrlKey:true,shiftKey:true},{metaKey:true},{ctrlKey:true,altKey:true}]){const e=new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true,...modifier});input.dispatchEvent(e);check(!e.defaultPrevented,'queue shortcut consumed by editor');check(input.value==='blue ey','queue shortcut accepts completion');}check(received===4,'queue shortcuts never reach document');const editing=new KeyboardEvent('keydown',{key:'a',ctrlKey:true,bubbles:true,cancelable:true});let leaked=false;const listener=()=>leaked=true;document.addEventListener('keydown',listener,{once:true});input.dispatchEvent(editing);document.removeEventListener('keydown',listener);check(!leaked,'editing shortcut leaked to graph');}finally{document.removeEventListener('keydown',run);input.blur();}});
